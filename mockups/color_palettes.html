<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Spectrum Review — v3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f8fafc;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            padding: 24px;
            max-width: 720px;
            margin: 0 auto;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .spectrum {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .color-row {
            display: grid;
            grid-template-columns: 130px 48px 1fr 1fr 1fr 1fr;
            gap: 8px;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .color-row:last-child {
            border-bottom: none;
        }

        .color-row.is-new {
            background: #f0fdf4;
            border-radius: 6px;
            padding: 6px 8px;
        }

        .color-name {
            font-size: 13px;
            font-weight: 600;
        }

        .color-hex {
            font-size: 11px;
            font-family: monospace;
            color: #64748b;
        }

        .bar {
            height: 32px;
            border-radius: 6px;
            position: relative;
        }

        .bar-label {
            position: absolute;
            top: -14px;
            left: 0;
            font-size: 9px;
            color: #94a3b8;
        }

        .swatch-full {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
        }

        .hue-marker {
            font-size: 10px;
            color: #94a3b8;
            margin-left: 4px;
        }

        .new-badge {
            font-size: 9px;
            color: #16a34a;
            font-weight: 700;
            background: #dcfce7;
            padding: 1px 5px;
            border-radius: 3px;
            margin-left: 4px;
        }

        .header-row {
            display: grid;
            grid-template-columns: 130px 48px 1fr 1fr 1fr 1fr;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 2px solid #cbd5e1;
            margin-bottom: 4px;
        }

        .header-cell {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .gap-warning {
            font-size: 11px;
            color: #f97316;
            font-weight: 600;
            padding: 4px 12px;
            text-align: center;
            background: #fff7ed;
            border-radius: 4px;
            margin: 2px 0;
        }
    </style>
</head>

<body>
    <h1>🌈 Vivid Rainbow — v3 (15 colors)</h1>
    <p class="subtitle">Dropped Hot Pink & Violet. Added Chartreuse (yellowish green) and Cerulean (between cyan &
        blue). Spectrum order against white.</p>

    <div class="header-row">
        <div class="header-cell">Color</div>
        <div class="header-cell">Full</div>
        <div class="header-cell">100%</div>
        <div class="header-cell">75%</div>
        <div class="header-cell">50%</div>
        <div class="header-cell">35%</div>
    </div>

    <div class="spectrum" id="spectrum"></div>

    <script>
        const palette = [
            { hex: '#FF1744', name: 'Scarlet', hue: 0 },
            { hex: '#FF5722', name: 'Vermillion', hue: 14 },
            { hex: '#FF9100', name: 'Tangerine', hue: 34 },
            // --- yellow gap ---
            { hex: '#76FF03', name: 'Chartreuse', hue: 100, isNew: true },
            { hex: '#00E676', name: 'Neon Green', hue: 145 },
            { hex: '#1DE9B6', name: 'Mint', hue: 162 },
            { hex: '#00E5FF', name: 'Cyan', hue: 187 },
            { hex: '#00A9E0', name: 'Cerulean', hue: 197, isNew: true },
            { hex: '#2979FF', name: 'Electric Blue', hue: 215 },
            { hex: '#304FFE', name: 'Cobalt', hue: 234 },
            { hex: '#6200EA', name: 'Royal', hue: 265 },
            { hex: '#AA00FF', name: 'Purple', hue: 275 },
            { hex: '#D500F9', name: 'Magenta', hue: 290 },
            { hex: '#C51162', name: 'Rose', hue: 330 },
            { hex: '#F50057', name: 'Crimson', hue: 340 },
        ];

        const container = document.getElementById('spectrum');

        palette.forEach((c, i) => {
            // Yellow gap marker
            if (c.name === 'Chartreuse') {
                const gap = document.createElement('div');
                gap.className = 'gap-warning';
                gap.textContent = '⚠️ YELLOW / LIME RESERVED — gap between 34° and 100°';
                container.appendChild(gap);
            }

            const row = document.createElement('div');
            row.className = 'color-row' + (c.isNew ? ' is-new' : '');

            const nameEl = document.createElement('div');
            nameEl.innerHTML = `<div class="color-name">${c.name}${c.isNew ? '<span class="new-badge">NEW</span>' : ''}</div><span class="color-hex">${c.hex}</span> <span class="hue-marker">${c.hue}°</span>`;
            row.appendChild(nameEl);

            const swatch = document.createElement('div');
            swatch.className = 'swatch-full';
            swatch.style.backgroundColor = c.hex;
            row.appendChild(swatch);

            [1.0, 0.75, 0.5, 0.35].forEach((opacity, j) => {
                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.backgroundColor = c.hex;
                bar.style.opacity = opacity;
                if (i === 0) {
                    const label = document.createElement('div');
                    label.className = 'bar-label';
                    label.textContent = `${Math.round(opacity * 100)}%`;
                    bar.appendChild(label);
                }
                row.appendChild(bar);
            });

            container.appendChild(row);
        });
    </script>
</body>

</html>
