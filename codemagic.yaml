workflows:
  ios-app-store:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "app_store_key"
    environment:
      groups:
        - apple_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    
    scripts:
      - name: Install NPM dependencies
        script: |
          npm install

      - name: Build Web App
        script: |
          npm run build

      - name: Patch Google Auth SDK for Privacy Manifest
        script: |
          # Apple requires GoogleSignIn 7.1.0+ for the privacy manifest.
          # The plugin hardcodes 6.2.4, so we patch it before syncing.
          sed -i '' "s/~> 6.2.4/~> 7.1.0/g" node_modules/@codetrix-studio/capacitor-google-auth/CodetrixStudioCapacitorGoogleAuth.podspec
          
      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Fetch Profiles and Build iOS
        script: |
          keychain initialize
          
          app-store-connect fetch-signing-files "com.goirl.app" \
            --type IOS_APP_STORE \
            --create
          
          keychain add-certificates
          
          xcode-project use-profiles
          
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Automatically upload the finished build to App Store Connect/TestFlight
      app_store_connect:
        auth: integration
        submit_to_testflight: false 
        submit_to_app_store: false
