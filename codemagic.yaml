workflows:
  ios-app-store:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    environment:
      # Automatically fetch Apple signing certificates using Codemagic's integration
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.goirl.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    
    scripts:
      - name: Install NPM dependencies
        script: |
          npm install

      - name: Build Web App
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Build iOS IPA
        script: |
          # Use Codemagic's built-in CLI tool to compile the archive
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Automatically upload the finished build to App Store Connect/TestFlight
      app_store_connect:
        auth: integration
        submit_to_testflight: false 
        submit_to_app_store: false
