workflows:
  ios-app-store:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "app_store_key"
    environment:
      groups:
        - apple_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    
    scripts:
      - name: Install NPM dependencies
        script: |
          npm install

      - name: Create Env File
        script: |
          ENV_BASE64=""
          echo "$ENV_BASE64" | base64 --decode > .env
          
          
      - name: Build Web App
        script: |
          npm run build

      - name: Patch Google Auth SDK for Privacy Manifest
        script: |
          # Apple requires GoogleSignIn 7.1.0+ for the privacy manifest.
          # The plugin hardcodes 6.2.4, so we patch it before syncing.
          sed -i '' "s/~> 6.2.4/~> 7.1.0/g" node_modules/@codetrix-studio/capacitor-google-auth/CodetrixStudioCapacitorGoogleAuth.podspec
          
          # The new 7.1.0 SDK breaks the plugin's Swift code, so we overwrite it with our patched version
          cp ios/patches/Plugin.swift node_modules/@codetrix-studio/capacitor-google-auth/ios/Plugin/Plugin.swift
          
      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Add Apple Sign-In Entitlement
        script: |
          # Create the entitlements file
          cat << 'EOF' > ios/App/App/App.entitlements
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.developer.applesignin</key>
              <array>
                  <string>Default</string>
              </array>
          </dict>
          </plist>
          EOF
          
          # Inject the CODE_SIGN_ENTITLEMENTS setting into Xcode project for all build configurations
          sed -i '' 's/INFOPLIST_FILE = App\/Info.plist;/INFOPLIST_FILE = App\/Info.plist; CODE_SIGN_ENTITLEMENTS = App\/App.entitlements;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Fetch Profiles and Build iOS
        script: |
          keychain initialize
          
          app-store-connect fetch-signing-files "com.goirl.app" \
            --type IOS_APP_STORE \
            --create
          
          # Set version to 1.1.6 (keep in sync with Android)
          NEW_VERSION="1.1.6"
          echo "Setting version to $NEW_VERSION (build $BUILD_NUMBER)"
          
          # Force-write into Info.plist (this is what ends up in the IPA)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $NEW_VERSION" ios/App/App/Info.plist
          
          # Also update project.pbxproj so Xcode doesn't override Info.plist during build
          sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = $NEW_VERSION;/g" ios/App/App.xcodeproj/project.pbxproj
          
          # Verify
          echo "Info.plist version: $(PlistBuddy -c 'Print :CFBundleShortVersionString' ios/App/App/Info.plist)"
          echo "Info.plist build:   $(PlistBuddy -c 'Print :CFBundleVersion' ios/App/App/Info.plist)"
          
          # 3. Modify Xcode project to use the profiles
          keychain add-certificates
          
          xcode-project use-profiles
          
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Automatically upload the finished build to App Store Connect/TestFlight
      app_store_connect:
        auth: integration
        submit_to_testflight: false 
        submit_to_app_store: false
