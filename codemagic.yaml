workflows:
  ios-app-store:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "internal dev"
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    
    scripts:
      - name: Install NPM dependencies
        script: |
          npm install

      - name: Build Web App
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Fetch Profiles and Build iOS
        script: |
          # 1. Force Codemagic to generate the App Store profile
          app-store-connect fetch-signing-files "com.goirl.app" \
            --type IOS_APP_STORE \
            --create
          
          # 2. Install the certificate
          keychain add-certificates
          
          # 3. Modify Xcode project to use the profiles
          xcode-project use-profiles
          
          # 4. Build the IPA in the EXACT SAME shell so it inherits the code signing variables
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --disable-automatic-provisioning

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Automatically upload the finished build to App Store Connect/TestFlight
      app_store_connect:
        auth: integration
        submit_to_testflight: false 
        submit_to_app_store: false
