workflows:
  ios-app-store:
    name: iOS App Store Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "internal dev"
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    
    scripts:
      - name: Install NPM dependencies
        script: |
          npm install

      - name: Build Web App
        script: |
          npm run build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Fetch and Create Signing Profiles
        script: |
          # Force Codemagic to generate the App Store profile if it's missing
          app-store-connect fetch-signing-files "com.goirl.app" \
            --type IOS_APP_STORE \
            --create
          
          # Install the downloaded certificate into the Mac's keychain
          keychain add-certificates
          
          # Tell Xcode to use the freshly generated profile
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          # Use Codemagic's built-in CLI tool to compile the archive
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # Automatically upload the finished build to App Store Connect/TestFlight
      app_store_connect:
        auth: integration
        submit_to_testflight: false 
        submit_to_app_store: false
